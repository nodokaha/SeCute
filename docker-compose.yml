services:
  tracker:
    build: ./tracker
    image: secute-tracker
    ports:
      # Localhost only by default. To serve it wider, put a reverse
      # proxy with access control (SSO / VPN / Cloudflare Access) in
      # front instead of widening this binding.
      - "127.0.0.1:8080:8080"
    environment:
      SECUTE_DB: /data/secute.db
      # Optional second layer: when set, mutating API endpoints
      # require this value in the X-API-Token header.
      # SECUTE_API_TOKEN: change-me
    volumes:
      - secute-data:/data
    restart: unless-stopped

volumes:
  secute-data:
